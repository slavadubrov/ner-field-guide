name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    name: offline (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported versions; no weights, GPU, or secrets.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: ${{ matrix.python }}
      # Small extras only: the real OpenAI SDK behind a mock transport, and
      # onnx for the graph tests. Model packages and weights stay out of CI.
      - run: uv sync --locked --extra teacher --extra onnx
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m scripts.run_all
      - run: uv build
      - name: Wheel ships the license
        run: unzip -l dist/*.whl | grep -q 'dist-info/licenses/LICENSE'
      - name: Offline smoke from the built wheel in a clean environment
        run: |
          uv venv --python ${{ matrix.python }} /tmp/ner-install
          uv pip install --python /tmp/ner-install/bin/python dist/*.whl
          cd /tmp && /tmp/ner-install/bin/python -m ner_demo.evaluate
