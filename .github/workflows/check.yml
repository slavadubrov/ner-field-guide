name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.13"
      - run: uv sync --locked --extra teacher
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m scripts.run_all
      - run: uv build
      - run: uv venv /tmp/ner-install && uv pip install --python /tmp/ner-install/bin/python dist/*.whl
      - run: cd /tmp && /tmp/ner-install/bin/python -m ner_demo.evaluate
