[project]
name = "ner-field-guide"
version = "0.3.0"
description = "Exact-span NER evaluation and pinned GLiNER-family adapters for a technical article"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Viacheslav Dubrov" }]
requires-python = ">=3.11"
keywords = ["ner", "named-entity-recognition", "gliner", "evaluation", "onnx"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Repository = "https://github.com/slavadubrov/ner-field-guide"
Documentation = "https://github.com/slavadubrov/ner-field-guide/tree/main/docs"
Issues = "https://github.com/slavadubrov/ner-field-guide/issues"
Changelog = "https://github.com/slavadubrov/ner-field-guide/blob/main/CHANGELOG.md"
Article = "https://slavadubrov.com/blog/2026/04/02/ner-guide/"

[project.optional-dependencies]
# gliner 0.2.29: bi-encoder label-embedding cache is used (0.2.28 re-encoded labels).
models = ["gliner==0.2.29", "transformers==5.1.0", "torch==2.11.0"]
# Fastino GLiNER2/GLiNER2.5 is a separate package; 2.1.0 is the first release
# with GLiNER2.5 checkpoints and transformers 5. Same torch/transformers pins.
gliner2 = ["gliner2[local]==2.1.0", "transformers==5.1.0", "torch==2.11.0"]
onnx = ["onnxruntime==1.24.4", "onnx==1.21.0"]
teacher = ["openai>=2.0,<3", "python-dotenv>=1.0.1,<2"]
data = ["pyarrow>=19,<24"]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ner_demo", "scripts"]

# Explicit list: hatchling ignores .git/info/exclude, so untracked local files
# would otherwise end up in the sdist.
[tool.hatch.build.targets.sdist]
include = [
    "/ner_demo",
    "/scripts",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/uv.lock",
    "/.env.example",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
