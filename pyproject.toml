[project]
name = "ner-field-guide"
version = "0.2.0"
description = "Reproducible occurrence-level NER demos for a technical article"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
models = ["gliner==0.2.28", "transformers==5.1.0", "torch==2.11.0"]
onnx = ["onnxruntime==1.24.4", "onnx==1.21.0"]
teacher = ["openai>=2.0,<3", "python-dotenv>=1.0.1,<2"]
data = ["pyarrow>=19,<24"]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ner_demo", "scripts"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
